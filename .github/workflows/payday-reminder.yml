name: Payday Debt Reminder

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Kuala_Lumpur
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override today's date (YYYY-MM-DD), for testing"
        required: false
        type: string
      dry_run:
        description: "Print the message instead of sending it to Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run debt reminder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE_OVERRIDE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$DATE_OVERRIDE" ]; then ARGS="$ARGS --date $DATE_OVERRIDE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python debt_reminder.py $ARGS

      - name: Record run (keeps the repo active for scheduled workflows)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: record run $(date -u +%F)"
            git push
          fi
